<style>
:root {
  --bg:#F5F3EE;--card:#fff;--border:#E6E2D9;--t1:#2C2416;--t2:#8C8070;
  --accent:#2E7D68;--accent-l:#2E7D6812;--hover:#EDEBE4;--input:#FAFAF7;
  --danger:#D94444;--warn:#E8940A;--ok:#1E8E54;
  --safe-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Rubik',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#D0C9BD;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}

/* Layout */
.header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.nav{display:flex;overflow-x:auto;gap:2px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}
.nav-btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--t2);background:transparent;display:flex;align-items:center;gap:5px;position:relative}
.nav-btn.active{background:var(--accent);color:#fff;font-weight:600}
.nav-badge{position:absolute;top:2px;left:4px;background:var(--danger);color:#fff;border-radius:99px;font-size:9px;font-weight:700;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.content{padding:16px;max-width:700px;margin:0 auto}

/* Components */
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--hover);color:var(--t1);border:1px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--t2);margin-bottom:4px}
.form-input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--input);font-size:13px;color:var(--t1)}
.form-select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--input);font-size:13px;color:var(--t1);cursor:pointer}

.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap}
.stat{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
.stat-value{font-size:22px;font-weight:700}
.stat-label{font-size:11px;color:var(--t2)}

.doc-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);margin-bottom:6px}
.doc-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.doc-info{flex:1;min-width:0}
.doc-title{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{display:flex;gap:8px;margin-top:3px;font-size:11px;color:var(--t2);flex-wrap:wrap}
.doc-actions{display:flex;gap:3px;flex-shrink:0}
.doc-actions button{background:var(--hover);border-radius:7px;padding:6px;display:flex;color:var(--t2)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
@media(min-width:600px){.modal{border-radius:16px;align-self:center;margin:20px}}

/* Upload */
.upload-area{display:flex;gap:8px}
.upload-btn{flex:1;position:relative;overflow:hidden;border-radius:11px}
.upload-btn input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:.01;cursor:pointer;z-index:2;font-size:0}
.upload-btn-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 12px;border-radius:11px;pointer-events:none}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:500;color:#fff;z-index:999;animation:fadeIn .2s ease}

/* Login */
.login-box{background:var(--card);border-radius:20px;padding:36px;width:90%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.08);animation:fadeIn .4s ease}

/* Payment status */
.pay-btns{display:flex;gap:6px}
.pay-btn{flex:1;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:500;border:2px solid var(--border);background:transparent;color:var(--t2)}
.pay-btn.active-paid{border-color:var(--ok);background:rgba(30,142,84,.08);color:var(--ok)}
.pay-btn.active-pending{border-color:var(--warn);background:rgba(232,148,10,.08);color:var(--warn)}
.pay-btn.active-overdue{border-color:var(--danger);background:rgba(217,68,68,.08);color:var(--danger)}

/* Chart placeholder */
.chart-container{width:100%;min-height:200px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:13px}

/* Fix 7: Accessibility focus states */
button:focus-visible,.form-input:focus-visible,.form-select:focus-visible,.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pay-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Fix 4: Loading overlay */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:flex;align-items:center;justify-content:center}
.loading-box{background:var(--card);border-radius:14px;padding:24px 32px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.loading-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}

/* Fix 6: Undo toast */
.undo-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:999;display:flex;align-items:center;gap:10px;animation:fadeIn .2s ease}
.undo-toast button{background:var(--accent);color:#fff;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600}

/* Fix 2: Better contrast */
.doc-meta{color:#6B5F50}

/* Fix: Salary table scroll on mobile */
.salary-detail{overflow-x:auto;-webkit-overflow-scrolling:touch}
.salary-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;min-width:420px;flex-wrap:nowrap}
.salary-row span{white-space:nowrap}
</style>
</head>

const fmtCur = n => { if(n==null||n===''||isNaN(n)) return ''; return new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS'}).format(Number(n)); };

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej();
    r.readAsDataURL(file);
  });
}

// AI — Gemini API (with timeout + error handling)
// ═══════════════════════════════════════════
const AI_TIMEOUT = 30000;
const GEMINI_MODELS = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash-001'];

// Rate limiting: max 5 AI calls per minute
const aiRateLimit = { calls: [], maxPerMinute: 5 };
function checkAiRate() {
  const now = Date.now();
  aiRateLimit.calls = aiRateLimit.calls.filter(t => now - t < 60000);
  if (aiRateLimit.calls.length >= aiRateLimit.maxPerMinute) return false;
  aiRateLimit.calls.push(now);
  return true;
}

// Input sanitization for AI prompts
function sanitizeAiInput(str, maxLen=500) {
  if (!str) return '';
  return String(str).slice(0, maxLen).replace(/[<>{}]/g, '');
}

function fetchWithTimeout(url, opts, ms=AI_TIMEOUT) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, {...opts, signal: ctrl.signal}).finally(() => clearTimeout(timer));
}

function getGeminiKey() {
  const key = localStorage.getItem('archive-ai-key');
  if (!key) throw new Error('NO_KEY');
  return key;
}

function handleAiError(e) {
  if (e.message === 'NO_KEY') { toast('⚠️ יש להגדיר מפתח Gemini בהגדרות', true); return; }
  if (e.name === 'AbortError') { toast('⏱️ timeout — נסה שוב', true); return; }
  if (e.message?.includes('429') || e.message?.includes('quota')) { toast('⏳ מכסת AI נגמרה — נסה שוב בעוד דקה', true); return; }
  if (e.message?.includes('400')) { toast('❌ בקשה לא תקינה — נסה קובץ אחר', true); return; }
  if (e.message?.includes('401') || e.message?.includes('403') || e.message?.includes('API_KEY')) { toast('🔑 מפתח Gemini לא תקין', true); return; }
  toast('❌ שגיאת AI — נסה שוב', true);
}

function buildGeminiParts(prompt, fileData) {
  const parts = [];
  if (fileData) {
    parts.push({ inlineData: { mimeType: fileData.type, data: fileData.b64 } });
  }
  parts.push({ text: prompt });
  return parts;
}

async function callGemini(prompt, fileData) {
  const key = getGeminiKey();
  let lastErr;
  // Try models in order until one works
  for (const model of GEMINI_MODELS) {
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
      const r = await fetchWithTimeout(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: buildGeminiParts(prompt, fileData) }],
          generationConfig: { temperature: 0.1, maxOutputTokens: 4096 }
        })
      });
      if (r.status === 429 || r.status === 404) { 
        const err = await r.json().catch(()=>({}));
        console.warn(`Model ${model}: ${r.status} - ${err.error?.message||''}`);
        lastErr = new Error(err.error?.message || String(r.status)); 
        continue; 
      }
      if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.error?.message || String(r.status)); }
      const d = await r.json();
      const text = d.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
      if (text) return text;
    } catch(e) {
      console.warn(`Model ${model} failed:`, e.message);
      lastErr = e;
    }
  }
  throw lastErr || new Error('All models failed');
}

async function aiExtract(catId, docName, notes, fileData) {
  if (!checkAiRate()) { toast('⏳ יותר מדי בקשות — המתן דקה', true); return null; }
  const cat = CATS[catId]; if(!cat) return null;
  const catPrompt = AI_PROMPTS[catId] || AI_PROMPTS.other;
  const keys = cat.fields.map(f => f.k);
  const safeName = sanitizeAiInput(docName);
  const safeNotes = sanitizeAiInput(notes, 1000);
  const prompt = `${catPrompt}

שם הקובץ: ${safeName}
${safeNotes ? 'הערות מהמשתמש: ' + safeNotes : ''}

חשוב מאוד:
1. החזר JSON בלבד — בלי backticks, בלי הסברים, בלי טקסט נוסף
2. רק את השדות הבאים: ${keys.join(', ')}
3. סכומים כ-numbers (בלי ₪ או פסיקים)
4. תאריכים בפורמט YYYY-MM-DD
5. null עבור שדות שלא מופיעים במסמך
6. אל תמציא ערכים — רק מה שכתוב במסמך`;
  try {
    const text = await callGemini(prompt, fileData);
    const clean = text.replace(/```json|```/g,'').trim();
    // Try to extract JSON from response
    let jsonMatch = clean.match(/\{[\s\S]*\}/);
    if (!jsonMatch) {
      // JSON might be truncated — try to fix by adding closing brace
      const openBrace = clean.indexOf('{');
      if (openBrace >= 0) {
        let partial = clean.slice(openBrace);
        // Remove trailing comma or incomplete value
        partial = partial.replace(/,\s*"[^"]*"?\s*:?\s*$/, '');
        partial = partial.replace(/,\s*$/, '');
        if (!partial.endsWith('}')) partial += '}';
        try { return JSON.parse(partial); } catch(e2) { console.error('Partial JSON fix failed:', e2.message); }
      }
      console.error('No JSON found in:', clean.slice(0,200)); 
      return null; 
    }
    return JSON.parse(jsonMatch[0]);
  } catch(e) { console.error('AI:',e); handleAiError(e); return null; }
}

async function aiCategorize(docName, notes, fileData) {
  if (!checkAiRate()) { toast('⏳ יותר מדי בקשות — המתן דקה', true); return null; }
  const catList = Object.entries(CATS).map(([id,c])=>`${id}: ${c.name}`).join('\n');
  const safeName = sanitizeAiInput(docName);
  const safeNotes = sanitizeAiInput(notes, 1000);
  const prompt = `אתה מסווג מסמכים ישראליים. זהה את הקטגוריה המתאימה ביותר.
שם המסמך: ${safeName}
${safeNotes ? 'הערות: ' + safeNotes : ''}

קטגוריות אפשריות:
${catList}

רמזים: תלוש/משכורת/שכר→salary, חשמל/IEC→electricity, מים/תאגיד→water, גז→gas, ארנונה/עירייה→arnona, אינטרנט/סלולר/בזק/פרטנר→internet, אחריות→warranty, ביטוח/פוליסה→insurance, מס/שומה/106→tax, חוזה/שכירות→contract, רפואי/מרשם/רופא→medical, לימודים/אוניברסיטה→education

החזר JSON בלבד: {"category":"<id>","reason":"<סיבה בעברית>"}`;
  try {
    const text = await callGemini(prompt, fileData);
    return JSON.parse(text.replace(/```json|```/g,'').trim());
  } catch(e) { console.error('AI:',e); handleAiError(e); return null; }
}

function getDocsRef() {
  if (State.shared && State.homeId) return db.collection('homes').doc(State.homeId).collection('documents');
  return db.collection('users').doc(State.user.uid).collection('documents');
}

function listenDocs() {
  if (State.unsubDocs) State.unsubDocs();
  State.unsubDocs = getDocsRef().orderBy('createdAt','desc').onSnapshot(snap => {
    State.docs = snap.docs.map(d => ({id:d.id,...d.data()}));
    render();
  });
}

async function saveDoc(doc) {
  const ref = getDocsRef();
  if (doc.id) { await ref.doc(doc.id).set(doc); }
  else { doc.createdAt = new Date().toISOString(); await ref.add(doc); }
}

async function deleteDoc(id) { await getDocsRef().doc(id).delete(); }

function softDelete(id) {
  const doc = State.docs.find(d=>d.id===id);
  if (!doc) return;
  // Remove from view immediately
  if (State.pendingDelete?.timer) { clearTimeout(State.pendingDelete.timer); actualDelete(State.pendingDelete.id); }
  State.pendingDelete = { id, doc, timer: setTimeout(()=>{ actualDelete(id); State.pendingDelete=null; hideUndo(); }, 5000) };
  State.docs = State.docs.filter(d=>d.id!==id);
  render();
  showUndo(doc.name);
}
function actualDelete(id) { getDocsRef().doc(id).delete().catch(()=>{}); }
function undoDelete() {
  if (!State.pendingDelete) return;
  clearTimeout(State.pendingDelete.timer);
  const doc = State.pendingDelete.doc;
  State.pendingDelete = null;
  hideUndo();
  saveDoc(doc);
  toast('המסמך שוחזר');
}
function showUndo(name) {
  hideUndo();
  const el=document.createElement('div');el.className='undo-toast';el.id='undoToast';
  el.innerHTML=`<span>${esc(name)} נמחק</span><button onclick="undoDelete()">ביטול</button>`;
  document.body.appendChild(el);
}

  // Copy personal docs to shared
  const personalDocs = await db.collection('users').doc(State.user.uid).collection('documents').get();
  const batch = db.batch();
  personalDocs.docs.forEach(d => {
    batch.set(db.collection('homes').doc(homeRef.id).collection('documents').doc(d.id), d.data());
  });
  await batch.commit();
  listenDocs();
  toast('בית משותף נוצר! קוד: ' + code);
  render();
}

async function joinHome(code) {
  if (!code) return;
  const snap = await db.collection('homes').where('code','==',code.toUpperCase()).get();
  if (snap.empty) { toast('קוד לא נמצא',true); return; }
  const homeDoc = snap.docs[0];
  const data = homeDoc.data();
  await homeDoc.ref.update({members:firebase.firestore.FieldValue.arrayUnion(State.user.uid)});
  await db.collection('users').doc(State.user.uid).set({homeId:homeDoc.id},{merge:true});
  State.homeId = homeDoc.id; State.homeCode = data.code; State.shared = true;
  State.homeName = data.name; State.homeMembers = data.members;
  listenDocs();
  toast('הצטרפת ל-' + data.name);
  render();
}

async function leaveSharedHome() {
  State.shared = false; State.homeId = null;
  await db.collection('users').doc(State.user.uid).update({homeId:firebase.firestore.FieldValue.delete()});
  listenDocs();
  render();
}

async function loadUserHome() {
  const userDoc = await db.collection('users').doc(State.user.uid).get();
  if (userDoc.exists && userDoc.data().homeId) {
    const homeId = userDoc.data().homeId;
    const homeDoc = await db.collection('homes').doc(homeId).get();
    if (homeDoc.exists) {
      const data = homeDoc.data();
      State.homeId = homeId; State.homeCode = data.code;
      State.homeName = data.name; State.homeMembers = data.members;
      State.shared = true;
    }
  }
  listenDocs();
}

// ═══════════════════════════════════════════
// COMPUTED
// ═══════════════════════════════════════════
function getAlerts() {
  const a = [];
  State.docs.forEach(d => {
    const f = d.fields||{};
    [[f.warrantyExpiry,'🛡️','אחריות',30],[f.endDate,'📝','חוזה',30],[f.renewalDate,'📋','ביטוח',30],[f.validUntil,'🏥','תוקף',14]].forEach(([dt,ic,tp,thr]) => {
      if(dt){const dd=daysUntil(dt);if(dd>=0&&dd<=thr)a.push({days:dd,msg:`${ic} ${d.name} — ${dd} ימים`});}
    });
    if((f.paid==='pending'||f.paid==='overdue')&&f.dueDate){const dd=daysUntil(f.dueDate);if(dd<=7)a.push({days:dd,msg:`💳 ${d.name} — ${dd<0?'באיחור!':'עד '+fmtDate(f.dueDate)}`});}
  });
  return a.sort((a,b)=>a.days-b.days);
}

function getUnpaid() { return State.docs.filter(d=>{const p=d.fields?.paid;return p==='pending'||p==='overdue';}); }

function getBalanceData() {
  const m = {};
  State.docs.forEach(d => {
    const amt=getAmt(d); if(!amt||!d.date) return;
    const dt=new Date(d.date);const k=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    if(!m[k])m[k]={month:k,income:0,expense:0};
    if(isIncome(d))m[k].income+=getIncomeAmt(d); else m[k].expense+=amt;
  });
  return Object.values(m).sort((a,b)=>a.month.localeCompare(b.month)).slice(-12)
    .map(x=>({...x,balance:x.income-x.expense,label:MONTHS_HE[parseInt(x.month.split('-')[1])-1]}));
}

function getSalaryStats() {
  const salaryDocs = State.docs.filter(d=>d.category==='salary').sort((a,b)=>(a.fields?.periodMonth||a.date||'').localeCompare(b.fields?.periodMonth||b.date||''));
  const byYear = {};
  salaryDocs.forEach(d => {
    const f=d.fields||{};
    const yr=f.periodMonth?f.periodMonth.split('-')[0]:(d.date?d.date.split('-')[0]:'????');
    if(!byYear[yr])byYear[yr]={year:yr,count:0,totalGross:0,totalNet:0,totalTax:0,totalPension:0,totalBonus:0,months:[]};
    const y=byYear[yr]; y.count++;
    y.totalGross+=Number(f.grossSalary||0); y.totalNet+=Number(f.netSalary||0);
    y.totalTax+=Number(f.taxDeducted||0); y.totalPension+=Number(f.pensionContrib||0);
    y.totalBonus+=Number(f.bonus||0);
    y.months.push({month:f.periodMonth||d.date,gross:Number(f.grossSalary||0),net:Number(f.netSalary||0),tax:Number(f.taxDeducted||0),vacation:Number(f.vacationDaysAccrued||0)-Number(f.vacationDaysUsed||0),sick:Number(f.sickDays||0)});
  });
  return Object.values(byYear).sort((a,b)=>b.year.localeCompare(a.year));
}

function docRowHtml(d) {
  const c = CATS[d.category]||CATS.other;
  const f = d.fields||{};
  const amt = getAmt(d);
  const details = [f.employer,f.periodMonth,f.productName,f.insurer,f.provider,f.providerName,f.contractType,f.institution].filter(Boolean).slice(0,2);
  const payHtml = f.paid ? `<span class="badge" style="background:${f.paid==='paid'?'var(--ok)':f.paid==='overdue'?'var(--danger)':'var(--warn)'}18;color:${f.paid==='paid'?'var(--ok)':f.paid==='overdue'?'var(--danger)':'var(--warn)'}">${f.paid==='paid'?'שולם ✅':f.paid==='overdue'?'באיחור 🔴':'ממתין ⏳'}</span>` : '';
  return `
    <div class="doc-row" role="listitem">
      <div class="doc-icon" style="background:${c.color}12">${c.icon}</div>
      <div class="doc-info">
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
          <span class="doc-title">${esc(d.name)}</span>
          <span class="badge" style="background:${c.color}16;color:${c.color}">${esc(c.name)}</span>
          ${payHtml}
        </div>
        <div class="doc-meta">
          ${d.date?`<span>📅 ${fmtDate(d.date)}</span>`:''}
          ${amt?`<span>${fmtCur(amt)}</span>`:''}
          ${details.map(x=>`<span>${esc(x)}</span>`).join('')}
          ${d.addedBy?`<span style="opacity:.6">ע״י ${esc(d.addedBy)}</span>`:''}
        </div>
      </div>
      <div class="doc-actions">
        <button onclick="openEditForm('${d.id}')" aria-label="עריכת ${esc(d.name)}">✏️</button>
        <button onclick="confirmDelete('${d.id}')" style="color:var(--danger)" aria-label="מחיקת ${esc(d.name)}">🗑️</button>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════
// CHARTS
// ═══════════════════════════════════════════
let chartInstances = {};

function renderCharts() {
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  const balCanvas = document.getElementById('chartBalance');
  if (balCanvas) {
    const bal = getBalanceData();
    if (bal.length) {
      chartInstances.bal = new Chart(balCanvas, {
        type:'bar',
        data:{labels:bal.map(m=>m.label),datasets:[
          {label:'הכנסות',data:bal.map(m=>m.income),backgroundColor:'#1E8E5488',borderRadius:4},
          {label:'הוצאות',data:bal.map(m=>m.expense),backgroundColor:'#D9444488',borderRadius:4},
        ]},
        options:{responsive:true,plugins:{legend:{labels:{font:{family:'Rubik'}}}},scales:{y:{beginAtZero:true}}}
      });
    }
  }

  const ieCanvas = document.getElementById('chartIncExp');
  if (ieCanvas) {
    const bal = getBalanceData();
    if (bal.length) {
      chartInstances.ie = new Chart(ieCanvas, {
        type:'bar',
        data:{labels:bal.map(m=>m.label),datasets:[
          {label:'הכנסות',data:bal.map(m=>m.income),backgroundColor:'#1E8E54',borderRadius:4},
          {label:'הוצאות',data:bal.map(m=>m.expense),backgroundColor:'#D94444',borderRadius:4},
        ]},
        options:{responsive:true,plugins:{legend:{labels:{font:{family:'Rubik'}}}},scales:{y:{beginAtZero:true}}}
      });
    }
  }
}

// ═══════════════════════════════════════════
// FORM MODAL
// ═══════════════════════════════════════════
let formState = { editing: null, file: null };

function openAddForm() {
  formState = { editing: null, file: null };
  showFormModal({ name:'', category:'other', date:new Date().toISOString().split('T')[0], notes:'', fields:{} });
}

function openEditForm(id) {
  const doc = State.docs.find(d=>d.id===id);
  if (!doc) return;
  formState = { editing: doc, file: null };
  showFormModal({ name:doc.name, category:doc.category, date:doc.date||'', notes:doc.notes||'', fields:{...doc.fields||{}} });
}

function showFormModal(data) {
  const catOptions = Object.entries(CATS).map(([id,c])=>`<option value="${id}" ${data.category===id?'selected':''}>${c.icon} ${c.name}</option>`).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="${formState.editing?'עריכת מסמך':'מסמך חדש'}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h3 style="font-size:16px;font-weight:700">${formState.editing?'עריכת מסמך':'מסמך חדש'}</h3>
        <button style="background:var(--hover);border-radius:7px;padding:5px" onclick="this.closest('.modal-overlay').remove()">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <!-- File Upload -->
        <div>
          <span class="form-label">📎 צרף מסמך (PDF / תמונה / צילום)</span>
          <div class="upload-area" id="uploadArea">
            <div class="upload-btn" style="border:2px dashed var(--accent)40;border-radius:11px">
              <input type="file" accept="image/*" capture="environment" onchange="handleFileUpload(this)">
              <div class="upload-btn-inner" style="background:var(--accent-l)">
                <span style="font-size:22px">📸</span>
                <span style="font-size:12px;font-weight:600;color:var(--accent)">צלם מסמך</span>
              </div>
            </div>
            <div class="upload-btn" style="border:2px dashed var(--border);border-radius:11px">
              <input type="file" accept="image/*,application/pdf" onchange="handleFileUpload(this)">
              <div class="upload-btn-inner" style="background:var(--input)">
                <span style="font-size:22px">📄</span>
                <span style="font-size:12px;font-weight:500;color:var(--t2)">PDF / תמונה</span>
              </div>
            </div>
          </div>
          <div id="filePreview" style="display:none;margin-top:8px"></div>
        </div>

        <!-- AI Scan -->
        <button class="btn" id="aiScanBtn" style="display:none;padding:12px;font-size:14px;background:linear-gradient(135deg,#7C3AED,#2E7D68);color:#fff" onclick="doAiFullScan()">
          ✨ סרוק מסמך — זהה וחלץ נתונים
        </button>
        <div id="aiStatus" style="display:none;text-align:center;padding:10px;color:var(--accent);font-size:13px">⏳ קורא מסמך...</div>

        <div><span class="form-label">שם המסמך *</span><input class="form-input" id="fName" value="${data.name}" placeholder='לדוגמה: "תלוש ינואר 2025"'></div>
        <div>
          <span class="form-label">קטגוריה</span>
          <div style="display:flex;gap:7px">
            <select class="form-select" id="fCat" onchange="updateCatFields()">${catOptions}</select>
            <button class="btn btn-secondary" style="white-space:nowrap;font-size:11px;padding:7px 12px" onclick="doAiCategorize()">✨ זהה</button>
          </div>
          <div id="aiCatResult" style="display:none;margin-top:5px;font-size:11px;color:var(--accent);background:var(--accent-l);padding:5px 9px;border-radius:7px"></div>
        </div>
        <div><span class="form-label">תאריך</span><input class="form-input" type="date" id="fDate" value="${data.date}"></div>
        <div><span class="form-label">הערות</span><textarea class="form-input" id="fNotes" rows="2" placeholder="הערות או תוכן מהמסמך...">${data.notes}</textarea></div>
        <button class="btn btn-secondary" style="background:#EDE9FE;color:#7C3AED" onclick="doAiExtract()">✨ חלץ נתונים</button>
        <div id="catFields" style="background:var(--input);border-radius:11px;padding:14px;border:1px solid var(--border)"></div>
        <button class="btn btn-primary" style="padding:12px;font-size:14px" onclick="doSaveForm()">💾 ${formState.editing?'שמור שינויים':'הוסף לארכיון'}</button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  updateCatFields(data.fields);
}

function updateCatFields(prefill) {
  const cat = CATS[$('#fCat')?.value || 'other'];
  if (!cat) return;
  const fields = prefill || formState.editing?.fields || {};
  const el = $('#catFields');
  if (!el) return;
  el.innerHTML = `<div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:10px">${cat.icon} שדות ${cat.name}</div>` +
    cat.fields.map(f => {
      if (f.t === 'pay') return `
        <div style="margin-bottom:8px"><span class="form-label">${f.l}</span>
        <div class="pay-btns">
          <button class="pay-btn ${fields[f.k]==='paid'?'active-paid':''}" onclick="setPayField('${f.k}','paid',this)">שולם ✅</button>
          <button class="pay-btn ${fields[f.k]==='pending'?'active-pending':''}" onclick="setPayField('${f.k}','pending',this)">ממתין ⏳</button>
          <button class="pay-btn ${fields[f.k]==='overdue'?'active-overdue':''}" onclick="setPayField('${f.k}','overdue',this)">באיחור 🔴</button>
        </div></div>`;
      if (f.t === 'select') return `
        <div style="margin-bottom:8px"><span class="form-label">${f.l}</span>
        <select class="form-select" data-field="${f.k}"><option value="">— בחר —</option>${f.opts.map(o=>`<option ${fields[f.k]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      const type = f.t==='num'?'number':f.t==='date'?'date':f.t==='month'?'month':'text';
      return `<div style="margin-bottom:8px"><span class="form-label">${f.l}</span><input class="form-input" type="${type}" data-field="${f.k}" value="${fields[f.k]||''}" ${f.t==='num'?'step="0.01"':''}></div>`;
    }).join('');
}

function setPayField(key, value, btn) {
  btn.closest('.pay-btns').querySelectorAll('.pay-btn').forEach(b=>{b.className='pay-btn';});
  btn.className = `pay-btn active-${value}`;
  btn.dataset.payValue = value;
}

function getFormFields() {
  const fields = {};
  $$('#catFields [data-field]').forEach(el => { if(el.value) fields[el.dataset.field]=el.value; });
  $$('#catFields .pay-btns').forEach(div => {
    const active = div.querySelector('.pay-btn[class*="active-"]');
    if (active) {
      const cls = [...active.classList].find(c=>c.startsWith('active-'));
      if (cls) fields[active.closest('[style]')?.querySelector('.pay-btn')?.dataset?.payValue || cls.replace('active-','')] = cls.replace('active-','');
      // Fix: get key from button
      const firstBtn = div.querySelector('.pay-btn');
      if (firstBtn) {
        const key = firstBtn.getAttribute('onclick')?.match(/setPayField\('(\w+)'/)?.[1];
        if (key && cls) fields[key] = cls.replace('active-','');
      }
    }
  });
  return fields;
}

async function handleFileUpload(input) {
  const file = input.files[0];
  const err = validateFile(file);
  if (err) { toast(err, true); input.value=''; return; }
  const b64 = await fileToBase64(file);
  formState.file = { b64, type: file.type, name: file.name, size: file.size };
  const preview = $('#filePreview');
  if (preview) {
    preview.style.display = 'block';
    preview.innerHTML = `<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px">
      ${file.type.startsWith('image/')?`<img src="data:${file.type};base64,${b64}" style="width:50px;height:50px;border-radius:8px;object-fit:cover">`:`<span style="font-size:28px">📄</span>`}
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(file.name)}</div><div style="font-size:11px;color:var(--t2)">${(file.size/1024).toFixed(0)} KB</div></div>
      <button style="background:var(--hover);border-radius:7px;padding:4px" onclick="clearFile()">✕</button>
    </div>`;
  }
  const scanBtn = $('#aiScanBtn');
  if (scanBtn) scanBtn.style.display = 'flex';
  const uploadArea = $('#uploadArea');
  if (uploadArea) uploadArea.style.display = 'none';
}

function clearFile() {
  formState.file = null;
  const preview = $('#filePreview'); if(preview){preview.style.display='none';preview.innerHTML='';}
  const scanBtn = $('#aiScanBtn'); if(scanBtn) scanBtn.style.display='none';
  const uploadArea = $('#uploadArea'); if(uploadArea) uploadArea.style.display='flex';
}

async function doAiFullScan() {
  showLoading('🤖 קורא את המסמך...');
  const scanBtn = $('#aiScanBtn'); if(scanBtn) scanBtn.style.display='none';
  const name = $('#fName')?.value || formState.file?.name || '';
  const notes = $('#fNotes')?.value || '';
  // Categorize
  const catR = await aiCategorize(name, notes, formState.file);
  if (catR) {
    $('#fCat').value = catR.category;
    updateCatFields();
    const cr = $('#aiCatResult'); if(cr){cr.style.display='block';cr.textContent=`✨ ${CATS[catR.category]?.name} — ${catR.reason}`;}
    // Extract
    const extR = await aiExtract(catR.category, name, notes, formState.file);
    if (extR) {
      Object.entries(extR).forEach(([k,v]) => {
        if(v==null) return;
        const el = document.querySelector(`[data-field="${k}"]`);
        if(el) el.value = String(v);
      });
      if(!$('#fName').value && formState.file) $('#fName').value = formState.file.name.replace(/\.[^.]+$/,'');
      toast('נסרק בהצלחה ✨');
    }
  }
  hideLoading();
}

async function doAiCategorize() {
  const name = $('#fName')?.value; const notes = $('#fNotes')?.value;
  if(!name && !formState.file) return;
  showLoading('✨ מזהה קטגוריה...');
  const r = await aiCategorize(name||formState.file?.name||'', notes, formState.file);
  hideLoading();
  if(r){$('#fCat').value=r.category;updateCatFields();const cr=$('#aiCatResult');if(cr){cr.style.display='block';cr.textContent=`✨ ${CATS[r.category]?.name} — ${r.reason}`;}}
}

async function doAiExtract() {
  const name=$('#fName')?.value;const notes=$('#fNotes')?.value;const cat=$('#fCat')?.value;
  if(!name&&!formState.file) return;
  showLoading('🤖 מחלץ נתונים...');
  const r = await aiExtract(cat, name||formState.file?.name||'', notes, formState.file);
  hideLoading();
  if(r){Object.entries(r).forEach(([k,v])=>{if(v==null)return;const el=document.querySelector(`[data-field="${k}"]`);if(el)el.value=String(v);});toast('נתונים חולצו ✨');}
  else toast('לא הצלחתי לחלץ',true);
}

async function doSaveForm() {
  const name = $('#fName')?.value?.trim();
  if (!name) { toast('יש להזין שם מסמך',true); $('#fName')?.focus(); return; }
  // Fix 8: Validate fields
  const fields = getFormFields();
  const cat = CATS[$('#fCat')?.value||'other'];
  if (cat) {
    for (const f of cat.fields) {
      if (f.t === 'num' && fields[f.k]) {
        const val = Number(fields[f.k]);
        if (isNaN(val) || val < 0) { toast(`${f.l}: ערך לא תקין`,true); return; }
      }
    }
  }
  showLoading('💾 שומר...');
  const doc = {
    name,
    category: $('#fCat')?.value || 'other',
    date: $('#fDate')?.value || null,
    notes: $('#fNotes')?.value?.trim() || null,
    fields,
    addedBy: State.user.displayName || State.user.email,
  };
  if (formState.editing) {
    doc.id = formState.editing.id;
    doc.createdAt = formState.editing.createdAt;
  }
  await saveDoc(doc);
  hideLoading();
  document.querySelector('.modal-overlay')?.remove();
  toast(formState.editing ? 'עודכן' : 'נוסף לארכיון');
}

function confirmDelete(id) {
  const doc = State.docs.find(d=>d.id===id);
  if (confirm(`למחוק את "${doc?.name}"?`)) {
    softDelete(id);
  }
}

// Fix 4: Loading overlay
function showLoading(msg='טוען...') {
  hideLoading();
  const el=document.createElement('div');el.className='loading-overlay';el.id='loadingOverlay';
  el.innerHTML=`<div class="loading-box"><div class="loading-spinner"></div><div style="font-size:13px;color:var(--t1)">${esc(msg)}</div></div>`;
  document.body.appendChild(el);
}
function hideLoading() { document.getElementById('loadingOverlay')?.remove(); }

// Fix 5: Modal ESC close + keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.remove();
  }
});

// ═══════════════════════════════════════════
// FILTER
// ═══════════════════════════════════════════
function filterDocs(term) {
  const list = $('#docList');
  if (!list) return;
  const filtered = State.docs.filter(d => {
    if (!term) return true;
    return d.name.includes(term) || (d.notes||'').includes(term) || Object.values(d.fields||{}).join(' ').includes(term);
  });
  list.innerHTML = filtered.map(d=>docRowHtml(d)).join('') || '<div class="card" style="text-align:center;padding:30px;color:var(--t2)">לא נמצאו</div>';
}

function filterCat(cat) {
  const list = $('#docList');
  if (!list) return;
  const filtered = cat==='all' ? State.docs : State.docs.filter(d=>d.category===cat);
  list.innerHTML = filtered.map(d=>docRowHtml(d)).join('') || '<div class="card" style="text-align:center;padding:30px;color:var(--t2)">לא נמצאו</div>';
}

// ═══════════════════════════════════════════
// NAV & AUTH
// ═══════════════════════════════════════════
function showView(v) { State.view = v; render(); }

async function doGoogleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const result = await auth.signInWithPopup(provider);
    console.log('Login success:', result.user.email);
  } catch(e) {
    console.error('Login error:', e.code, e.message);
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
      toast('חלון ההתחברות נחסם. נסה שוב או אפשר popups', true);
    } else {
      toast('שגיאה: ' + (e.message || 'נסה שוב'), true);
    }
  }
}

function doLogout() { auth.signOut(); }

// Auth state listener
auth.onAuthStateChanged(async user => {
  console.log('Auth state changed:', user ? user.email : 'logged out');
  if (user) {
    State.user = user;
    try {
      await loadUserHome();
    } catch(e) {
      console.error('loadUserHome error:', e);
    }
    render();
  } else {
    State.user = null;
    State.docs = [];
    State.shared = false;
    if (State.unsubDocs) { State.unsubDocs(); State.unsubDocs = null; }
    render();
  }
});

// Show loading until auth resolves
$('#app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="text-align:center"><div class="loading-spinner" style="width:32px;height:32px;margin:0 auto 12px"></div><div style="color:var(--t2);font-size:14px">מתחבר...</div></div></div>';

// PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
